# Nginx 反代示例：域名 wannian.fun → Node together-listen（3847）
# 复制到 /etc/nginx/sites-available/ 后 ln -s，nginx -t && reload
#
# 需已解析 wannian.fun 到本机，并申请 TLS 证书（certbot 等）。

upstream together_listen {
    server 127.0.0.1:3847;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wannian.fun www.wannian.fun;
    return 301 https://wannian.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wannian.fun www.wannian.fun;

    ssl_certificate     /etc/letsencrypt/live/wannian.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wannian.fun/privkey.pem;

    # 统一用主域名
    if ($host = www.wannian.fun) {
        return 301 https://wannian.fun$request_uri;
    }

    location / {
        proxy_pass http://together_listen;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
